<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌳 Mi Árbol Genealógico</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:#2b3442;min-height:100vh;padding-bottom:50px;
    background:
      radial-gradient(1200px 600px at 12% -10%, #fff3e2 0%, transparent 60%),
      radial-gradient(1000px 520px at 92% 5%, #e6efff 0%, transparent 55%),
      #f4f7fb;
  }
  header{padding:26px 20px 8px;text-align:center}
  h1{
    display:inline-block;margin:0;padding:4px 14px;border-radius:12px;
    font-size:clamp(19px,3vw,28px);font-weight:700;letter-spacing:-.5px;color:#1e2a3c;
    transition:background .15s;
  }
  h1:hover{background:rgba(255,255,255,.7)}
  .hint{font-size:12.5px;color:#8592a6;margin:8px 0 14px}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    padding:0 16px 8px;
  }
  .toolbar button{
    font:inherit;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:10px;cursor:pointer;
    border:1px solid #d7e0ec;background:#fff;color:#3c4a5e;
    box-shadow:0 2px 6px rgba(40,60,90,.06);
    transition:transform .15s,box-shadow .15s,background .15s;
  }
  .toolbar button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(40,60,90,.12)}
  .toolbar button.primary{background:#3f7dfb;border-color:#3f7dfb;color:#fff}
  .toolbar button.primary:hover{background:#2f6ceb}
  .toolbar button.danger:hover{background:#fff1f1;border-color:#f3b7b7;color:#c33}

  #canvas{
    position:relative;display:flex;flex-direction:column;
    align-items:center;gap:95px;
    padding:55px 60px 80px;
    overflow-x:auto;overflow-y:hidden;
  }
  #lines{
    position:absolute;top:0;left:0;
    pointer-events:none;z-index:0;overflow:visible;
  }
  #lines path{
    fill:none;stroke:#c3cfe0;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .gen{
    position:relative;width:100%;
    display:flex;justify-content:center;align-items:flex-start;
    gap:74px;z-index:1;
  }
  .gen-label{
    position:absolute;left:-4px;top:50%;transform:translateY(-50%);
    font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:#a8b4c6;writing-mode:vertical-rl;rotate:180deg;pointer-events:none;
    white-space:nowrap;
  }
  .couple{display:flex;gap:28px;align-items:flex-start}
  .single{display:flex}

  /* ---------- Tarjeta ---------- */
  .card{
    position:relative;width:172px;background:#fff;border-radius:18px;
    padding:16px 12px 14px;text-align:center;border:2px solid transparent;
    box-shadow:0 6px 20px rgba(40,60,90,.09);
    transition:transform .18s ease,box-shadow .18s ease;
    animation:pop .35s ease backwards;
  }
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(40,60,90,.15)}
  .card.masc{border-color:#bcd8f8;background:linear-gradient(180deg,#f7fbff,#fff)}
  .card.fem{border-color:#f8cbdd;background:linear-gradient(180deg,#fff8fb,#fff)}

  .avatar{
    width:56px;height:56px;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    font-size:29px;line-height:1;cursor:pointer;
    border-radius:50%;border:none;background:#eef3fa;
    box-shadow:inset 0 0 0 1px rgba(60,90,140,.08);
    transition:transform .15s,box-shadow .15s;
  }
  .card.fem .avatar{background:#fdeef4}
  .avatar:hover{transform:scale(1.08);box-shadow:0 4px 14px rgba(60,90,140,.18)}

  .campo{
    padding:3px 6px;border-radius:7px;outline:none;
    transition:background .15s;word-break:break-word;min-height:1.2em;
  }
  .campo:hover{background:rgba(63,125,251,.07)}
  .campo:focus{background:rgba(63,125,251,.13);box-shadow:0 0 0 2px rgba(63,125,251,.25)}
  .campo:empty::before{content:attr(data-ph);color:#bcc6d4;font-style:italic}

  .nombre{font-weight:700;font-size:14.5px;color:#1f2b3d;line-height:1.25}
  .fechas{font-size:11.5px;color:#7f8da3;margin-top:5px;font-variant-numeric:tabular-nums}
  .lugar{font-size:11px;color:#a3aebe;margin-top:2px}

  .add{
    position:absolute;top:6px;left:6px;
    width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;
    background:#3f7dfb;color:#fff;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s,transform .15s;
    box-shadow:0 2px 6px rgba(63,125,251,.4);
  }
  .card:hover .add{opacity:1}
  .add:hover{transform:scale(1.15)}
  .del{
    position:absolute;top:6px;right:6px;
    width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;
    background:#f1f4f9;color:#93a0b3;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s,background .15s,color .15s;
  }
  .card:hover .del{opacity:1}
  .del:hover{background:#ffe3e3;color:#d64545}

  /* ---------- Menú ---------- */
  .card-menu{
    position:fixed;z-index:200;
    display:flex;flex-direction:column;
    background:#fff;border-radius:14px;padding:6px;
    box-shadow:0 14px 38px rgba(30,45,70,.22);
    border:1px solid #e4eaf3;min-width:190px;
    animation:pop .16s ease;
  }
  .card-menu button{
    font:inherit;font-size:13px;font-weight:600;text-align:left;
    padding:9px 12px;border-radius:9px;cursor:pointer;
    border:none;background:transparent;color:#2b3442;
    display:flex;align-items:center;gap:8px;
    transition:background .12s,color .12s;
  }
  .card-menu button:hover:not(:disabled){background:#eef4ff;color:#1a4ed8}
  .card-menu button:disabled{opacity:.35;cursor:not-allowed}
  .card-menu button.danger:hover:not(:disabled){background:#fff1f1;color:#c33}

  /* ---------- Picker ---------- */
  .picker{
    position:fixed;z-index:100;
    display:grid;grid-template-columns:repeat(6,1fr);gap:3px;
    padding:8px;border-radius:14px;background:#fff;
    box-shadow:0 12px 34px rgba(30,45,70,.22);
    border:1px solid #e4eaf3;animation:pop .16s ease;
  }
  .picker button{
    width:32px;height:32px;border:none;background:transparent;
    font-size:19px;cursor:pointer;border-radius:8px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s,transform .12s;
  }
  .picker button:hover{background:#eef4ff;transform:scale(1.15)}

  @media (max-width:900px){
    #canvas{padding:40px 24px 60px;gap:80px}
    .gen{gap:40px}
    .couple{gap:18px}
    .gen-label{display:none}
    .card{width:150px}
  }
</style>
</head>
<body>

<header>
  <h1 id="titulo" contenteditable="true" spellcheck="false">Mi Árbol Genealógico</h1>
  <p class="hint">✏️ Clic en el texto para editarlo · Pulsa <b>＋</b> en una tarjeta para añadir familiares · Clic en el icono para cambiarlo</p>
  <div class="toolbar">
    <button id="btnExport">⬇ Exportar</button>
    <button id="btnImport">⬆ Importar</button>
    <button id="btnReset" class="danger">↺ Reiniciar</button>
    <input type="file" id="fileInput" accept="application/json" hidden>
  </div>
</header>

<main id="canvas">
  <svg id="lines"></svg>
</main>

<script>
/* ============================================================
   DATOS  v2
   persona: { nombre, genero, emoji, fechas, lugar,
              padres: [id...],   // 0, 1 ó 2
              pareja: id | null  // enlace bidireccional
            }
   ============================================================ */
const STORAGE_KEY = 'arbol-familiar-v2';
const EMOJIS = ['🙂','😀','👨','👩','🧑','👦','👧','👴','👵','👶','🧔','👨‍🦱','👩‍🦰','👨‍🦳','👩‍🦳','🧒','💙','💗','🌟'];

function plantilla(){
  return {
    titulo: 'Mi Árbol Genealógico',
    personas: {
      abueloP: { nombre:'Abuelo paterno', genero:'m', emoji:'👴', fechas:'', lugar:'', padres:[],           pareja:'abuelaP' },
      abuelaP: { nombre:'Abuela paterna', genero:'f', emoji:'👵', fechas:'', lugar:'', padres:[],           pareja:'abueloP' },
      abueloM: { nombre:'Abuelo materno', genero:'m', emoji:'👴', fechas:'', lugar:'', padres:[],           pareja:'abuelaM' },
      abuelaM: { nombre:'Abuela materna', genero:'f', emoji:'👵', fechas:'', lugar:'', padres:[],           pareja:'abueloM' },
      padre:   { nombre:'Papá',           genero:'m', emoji:'👨', fechas:'', lugar:'', padres:['abueloP','abuelaP'], pareja:'madre' },
      madre:   { nombre:'Mamá',           genero:'f', emoji:'👩', fechas:'', lugar:'', padres:['abueloM','abuelaM'], pareja:'padre' },
      yo:      { nombre:'Yo',             genero:'m', emoji:'🙂', fechas:'', lugar:'', padres:['padre','madre'],     pareja:null }
    }
  };
}

function cargar(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d.personas || !d.personas.yo || !Array.isArray(d.personas.yo.padres)) return null;
    return d;
  }catch(e){ return null; }
}
function guardar(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }

let data = cargar() || plantilla();

/* ============================================================
   NIVELES (BFS desde "yo")
   ============================================================ */
function computeLevels(){
  const nivel = { yo: 0 };
  const cola = ['yo'];
  const visitado = new Set();

  while (cola.length){
    const id = cola.shift();
    if (visitado.has(id)) continue;
    if (!data.personas[id]) continue;
    visitado.add(id);
    const L = nivel[id];
    const p = data.personas[id];

    for (const pid of (p.padres || [])){
      if (data.personas[pid] && nivel[pid] === undefined){
        nivel[pid] = L + 1; cola.push(pid);
      }
    }
    if (p.pareja && data.personas[p.pareja] && nivel[p.pareja] === undefined){
      nivel[p.pareja] = L; cola.push(p.pareja);
    }
    for (const cid in data.personas){
      if (data.personas[cid].padres?.includes(id) && nivel[cid] === undefined){
        nivel[cid] = L - 1; cola.push(cid);
      }
    }
  }

  const levels = {};
  for (const id in nivel){
    const L = nivel[id];
    (levels[L] = levels[L] || []).push(id);
  }
  return levels;
}

/* ============================================================
   ORDENACIÓN (barycenter heuristic)
   ============================================================ */
function groupIntoUnits(ids){
  const units = [], used = new Set();
  for (const id of ids){
    if (used.has(id)) continue;
    const p = data.personas[id];
    if (p.pareja && ids.includes(p.pareja) && !used.has(p.pareja)){
      units.push([id, p.pareja]);
      used.add(id); used.add(p.pareja);
    } else {
      units.push([id]); used.add(id);
    }
  }
  return units;
}

function ordenarNiveles(levels){
  const levelKeys = Object.keys(levels).map(Number).sort((a,b) => b - a);
  const orden = {};
  for (const L of levelKeys) orden[L] = groupIntoUnits(levels[L]);

  function getPos(id){
    for (const L of levelKeys){
      const arr = orden[L];
      for (let j = 0; j < arr.length; j++){
        const idx = arr[j].indexOf(id);
        if (idx >= 0) return j * 10 + idx;
      }
    }
    return -1;
  }

  for (let iter = 0; iter < 4; iter++){
    for (const L of levelKeys){
      const withBary = orden[L].map((unit, idx) => {
        const ns = [];
        for (const id of unit){
          const p = data.personas[id];
          for (const pid of (p.padres || [])){
            const pos = getPos(pid);
            if (pos >= 0) ns.push(pos);
          }
          for (const cid in data.personas){
            if (data.personas[cid].padres?.includes(id)){
              const pos = getPos(cid);
              if (pos >= 0) ns.push(pos);
            }
          }
        }
        const bary = ns.length ? ns.reduce((a,b)=>a+b,0)/ns.length : idx*10;
        return { unit, bary, idx };
      });
      withBary.sort((a,b) => a.bary - b.bary || a.idx - b.idx);
      orden[L] = withBary.map(x => x.unit);
    }
  }
  return { levelKeys, orden };
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const canvas = document.getElementById('canvas');
  canvas.querySelectorAll('.gen').forEach(el => el.remove());

  const levels = computeLevels();
  const { levelKeys, orden } = ordenarNiveles(levels);

  const etiquetas = {
    0: 'Yo',
    1: 'Padres', 2: 'Abuelos', 3: 'Bisabuelos', 4: 'Tatarabuelos',
    '-1': 'Hijos', '-2': 'Nietos', '-3': 'Bisnietos'
  };

  for (const L of levelKeys){
    const fila = document.createElement('div');
    fila.className = 'gen';

    const label = document.createElement('span');
    label.className = 'gen-label';
    label.textContent = etiquetas[L] || (L > 0 ? '+' + L : L);
    fila.appendChild(label);

    for (const unit of orden[L]){
      const wrap = document.createElement('div');
      wrap.className = unit.length === 2 ? 'couple' : 'single';
      unit.forEach(id => wrap.appendChild(crearTarjeta(id)));
      fila.appendChild(wrap);
    }
    canvas.appendChild(fila);
  }
  programarDibujo();
}

function crearTarjeta(id){
  const p = data.personas[id];
  const card = document.createElement('div');
  card.className = 'card ' + (p.genero === 'f' ? 'fem' : 'masc');
  card.dataset.id = id;

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'add';
  addBtn.textContent = '＋';
  addBtn.title = 'Añadir familiar';
  addBtn.addEventListener('click', e => { e.stopPropagation(); abrirMenu(id, addBtn); });
  card.appendChild(addBtn);

  const avatar = document.createElement('button');
  avatar.type = 'button';
  avatar.className = 'avatar';
  avatar.title = 'Cambiar icono';
  avatar.textContent = p.emoji || '🙂';
  avatar.addEventListener('click', () => abrirPicker(avatar, id));
  card.appendChild(avatar);

  card.appendChild(campo(id, 'nombre', 'Nombre', 'nombre'));
  card.appendChild(campo(id, 'fechas', '1950 – 2020', 'fechas'));
  card.appendChild(campo(id, 'lugar', 'Ciudad', 'lugar'));

  if (id !== 'yo'){
    const del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.textContent = '×';
    del.title = 'Eliminar';
    del.addEventListener('click', () => removePerson(id));
    card.appendChild(del);
  }
  return card;
}

function campo(id, key, placeholder, clase){
  const el = document.createElement('div');
  el.className = 'campo ' + clase;
  el.contentEditable = 'true';
  el.spellcheck = false;
  el.dataset.ph = placeholder;
  el.dataset.field = key;
  el.textContent = data.personas[id][key] || '';

  el.addEventListener('input', () => {
    data.personas[id][key] = el.textContent.trim();
    guardar(); programarDibujo();
  });
  el.addEventListener('blur', () => {
    if (!el.textContent.trim()) el.innerHTML = '';
    data.personas[id][key] = el.textContent.trim();
    guardar(); programarDibujo();
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); el.blur(); }
  });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const texto = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, texto);
  });
  return el;
}

/* ============================================================
   DIBUJO SVG
   ============================================================ */
let rafId = null;
function programarDibujo(){
  if (rafId) return;
  rafId = requestAnimationFrame(() => { rafId = null; dibujarLineas(); });
}

function dibujarLineas(){
  const canvas = document.getElementById('canvas');
  const svg    = document.getElementById('lines');
  const cr     = canvas.getBoundingClientRect();
  const sl     = canvas.scrollLeft, st = canvas.scrollTop;

  const W = canvas.scrollWidth, H = canvas.scrollHeight;
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.style.width  = W + 'px';
  svg.style.height = H + 'px';

  const rect = id => {
    const el = document.querySelector('.card[data-id="' + id + '"]');
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return {
      left: r.left - cr.left + sl, right: r.right - cr.left + sl,
      top:  r.top  - cr.top  + st, bottom:r.bottom - cr.top + st,
      cx:   r.left - cr.left + sl + r.width/2,
      cy:   r.top  - cr.top  + st + r.height/2
    };
  };

  const grupos = {};
  for (const cid in data.personas){
    const c = data.personas[cid];
    if (!c.padres || !c.padres.length) continue;
    const key = [...c.padres].sort().join('|');
    if (!grupos[key]) grupos[key] = { parents: c.padres.slice(), children: [] };
    grupos[key].children.push(cid);
  }

  const paths = [];

  for (const key in grupos){
    const g = grupos[key];
    const rectsP = g.parents.map(rect).filter(Boolean);
    const rectsC = g.children.map(rect).filter(Boolean);
    if (!rectsP.length || !rectsC.length) continue;

    let midX, yBase;
    if (rectsP.length === 2){
      const [A, B] = rectsP;
      yBase = (A.cy + B.cy) / 2;
      const L = A.cx < B.cx ? A : B;
      const R = A.cx < B.cx ? B : A;
      paths.push(`M ${L.right} ${yBase} H ${R.left}`);
      midX = (L.right + R.left) / 2;
    } else {
      midX = rectsP[0].cx;
      yBase = rectsP[0].bottom;
    }

    const fondoP = Math.max(...rectsP.map(r => r.bottom));
    const techoC = Math.min(...rectsC.map(r => r.top));
    const unionY = fondoP + (techoC - fondoP) * 0.45;

    paths.push(`M ${midX} ${yBase} V ${unionY}`);
    const xs = rectsC.map(r => r.cx);
    const minX = Math.min(midX, ...xs), maxX = Math.max(midX, ...xs);
    if (maxX - minX > 1) paths.push(`M ${minX} ${unionY} H ${maxX}`);
    for (const r of rectsC) paths.push(`M ${r.cx} ${unionY} V ${r.top}`);
  }

  svg.innerHTML = paths.map(d => `<path d="${d}"/>`).join('');
}

/* ============================================================
   MENÚ DE AÑADIR
   ============================================================ */
let menuEl = null;

function abrirMenu(id, anchor){
  cerrarMenu();
  const p = data.personas[id];
  const menu = document.createElement('div');
  menu.className = 'card-menu';

  const tienePadre = p.padres.some(pid => data.personas[pid]?.genero === 'm');
  const tieneMadre = p.padres.some(pid => data.personas[pid]?.genero === 'f');
  const slotLibre  = p.padres.length < 2;

  const add = (txt, fn, disabled=false, danger=false) => {
    const b = document.createElement('button');
    b.textContent = txt;
    b.disabled = disabled;
    if (danger) b.className = 'danger';
    if (!disabled) b.addEventListener('click', () => { cerrarMenu(); fn(); });
    menu.appendChild(b);
  };

  add('↑  Añadir padre',   () => addParent(id, 'm'), !slotLibre || tienePadre);
  add('↑  Añadir madre',   () => addParent(id, 'f'), !slotLibre || tieneMadre);
  add('↓  Añadir hijo/a',  () => addChild(id));
  add('↔  Añadir hermano/a',() => addSibling(id), !p.padres.length);
  add('💑  Añadir pareja',  () => addPartner(id), !!p.pareja);
  if (id !== 'yo') add('✕  Eliminar', () => removePerson(id), false, true);

  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = r.left;
  let top  = r.bottom + 6;
  if (left + mw > innerWidth - 8) left = innerWidth - mw - 8;
  if (top + mh > innerHeight - 8) top = r.top - mh - 6;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top  = Math.max(8, top) + 'px';

  menuEl = menu;
  setTimeout(() => document.addEventListener('click', fueraMenu), 0);
}
function fueraMenu(e){ if (menuEl && !menuEl.contains(e.target)) cerrarMenu(); }
function cerrarMenu(){
  if (menuEl){ menuEl.remove(); menuEl = null; }
  document.removeEventListener('click', fueraMenu);
}

/* ============================================================
   ACCIONES DE ÁRBOL
   ============================================================ */
function uid(prefix){ return prefix + Date.now() + Math.floor(Math.random()*1000); }

function addParent(id, genero){
  const p = data.personas[id];
  if (p.padres.length >= 2) return;
  const nid = uid('p');
  data.personas[nid] = {
    nombre: genero === 'm' ? 'Padre' : 'Madre',
    genero, emoji: genero === 'm' ? '👨' : '👩',
    fechas:'', lugar:'', padres:[], pareja:null
  };
  p.padres.push(nid);
  guardar(); render();
}

function addChild(id){
  const p = data.personas[id];
  const nid = uid('c');
  const padres = [id];
  if (p.pareja && data.personas[p.pareja]) padres.push(p.pareja);
  data.personas[nid] = {
    nombre:'Hijo/a', genero:'m', emoji:'🧒',
    fechas:'', lugar:'', padres, pareja:null
  };
  guardar(); render();
}

function addSibling(id){
  const p = data.personas[id];
  if (!p.padres.length){
    alert('Esta persona necesita al menos un progenitor. Añádele primero un padre o una madre.');
    return;
  }
  const nid = uid('s');
  data.personas[nid] = {
    nombre:'Hermano/a', genero:'m', emoji:'🧑',
    fechas:'', lugar:'', padres:[...p.padres], pareja:null
  };
  guardar(); render();
}

function addPartner(id){
  const p = data.personas[id];
  if (p.pareja) return;
  const nid = uid('p');
  const genero = p.genero === 'm' ? 'f' : 'm';
  data.personas[nid] = {
    nombre:'Pareja', genero,
    emoji: genero === 'm' ? '👨' : '👩',
    fechas:'', lugar:'', padres:[], pareja:id
  };
  p.pareja = nid;
  guardar(); render();
}

function removePerson(id){
  if (id === 'yo') return;
  if (!confirm('¿Eliminar a esta persona del árbol?')) return;
  delete data.personas[id];
  for (const pid in data.personas){
    const p = data.personas[pid];
    p.padres = (p.padres || []).filter(x => x !== id);
    if (p.pareja === id) p.pareja = null;
  }
  guardar(); render();
}

/* ============================================================
   SELECTOR DE EMOJI
   ============================================================ */
let pickerEl = null;

function abrirPicker(anchor, id){
  cerrarPicker();
  const pop = document.createElement('div');
  pop.className = 'picker';

  EMOJIS.forEach(e => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = e;
    b.addEventListener('click', () => {
      data.personas[id].emoji = e;
      anchor.textContent = e;
      guardar(); cerrarPicker();
    });
    pop.appendChild(b);
  });

  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 8)) + 'px';
  pop.style.top  = (r.bottom + h + 12 > innerHeight ? r.top - h - 8 : r.bottom + 8) + 'px';

  pickerEl = pop;
  setTimeout(() => document.addEventListener('click', fueraClick), 0);
}
function fueraClick(e){ if (pickerEl && !pickerEl.contains(e.target)) cerrarPicker(); }
function cerrarPicker(){
  if (pickerEl){ pickerEl.remove(); pickerEl = null; }
  document.removeEventListener('click', fueraClick);
}

/* ============================================================
   EXPORTAR / IMPORTAR / RESET
   ============================================================ */
function exportar(){
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'arbol-genealogico.json'; a.click();
  URL.revokeObjectURL(url);
}

function importar(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if (!d.personas || !d.personas.yo) throw new Error('Formato inválido');
      data = d; guardar();
      document.getElementById('titulo').textContent = data.titulo || 'Mi Árbol Genealógico';
      render();
    }catch(e){ alert('No se pudo importar: ' + e.message); }
  };
  reader.readAsText(file);
}

function reiniciar(){
  if (!confirm('Se borrarán todos los cambios. ¿Continuar?')) return;
  data = plantilla();
  localStorage.removeItem(STORAGE_KEY);
  guardar();
  document.getElementById('titulo').textContent = data.titulo;
  render();
}

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
const tituloEl = document.getElementById('titulo');
tituloEl.textContent = data.titulo || 'Mi Árbol Genealógico';
tituloEl.addEventListener('input', () => { data.titulo = tituloEl.textContent.trim(); guardar(); });
tituloEl.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); tituloEl.blur(); } });

document.getElementById('btnExport').addEventListener('click', exportar);
document.getElementById('btnReset').addEventListener('click', reiniciar);

const fileInput = document.getElementById('fileInput');
document.getElementById('btnImport').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) importar(e.target.files[0]);
  e.target.value = '';
});

render();

window.addEventListener('resize', programarDibujo);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(programarDibujo);
new ResizeObserver(programarDibujo).observe(document.getElementById('canvas'));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌳 Mi Árbol Genealógico</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#2b3442;min-height:100vh;padding-bottom:50px;background:radial-gradient(1200px 600px at 12% -10%,#fff3e2 0%,transparent 60%),radial-gradient(1000px 520px at 92% 5%,#e6efff 0%,transparent 55%),#f4f7fb}header{padding:26px 20px 8px;text-align:center}h1{display:inline-block;margin:0;padding:4px 14px;border-radius:12px;font-size:clamp(19px,3vw,28px);font-weight:700;letter-spacing:-.5px;color:#1e2a3c}.hint{font-size:12.5px;color:#8592a6;margin:8px 0 14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px 8px}.toolbar button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;border:1px solid #d7e0ec;background:#fff;color:#3c4a5e;box-shadow:0 2px 6px #283c5a10}.toolbar button:hover{transform:translateY(-2px);box-shadow:0 6px 14px #283c5a1f}.toolbar button.danger:hover{background:#fff1f1;border-color:#f3b7b7;color:#c33}
#canvas{position:relative;display:flex;flex-direction:column;align-items:center;gap:95px;padding:55px 60px 80px;overflow-x:auto;overflow-y:hidden}#lines{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible}#lines path{fill:none;stroke:#b9c8dc;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.gen{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-start;gap:68px;z-index:1}.gen-label{position:absolute;left:-4px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#a8b4c6;writing-mode:vertical-rl;rotate:180deg;pointer-events:none;white-space:nowrap}.family-group{display:flex;align-items:flex-start;gap:28px;padding:0 14px 12px;border-radius:18px;position:relative}.family-group.has-children{background:rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(195,207,224,.35)}.family-group.has-children:before{content:'familia';position:absolute;top:-17px;left:16px;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:#b1bdce}.couple{display:flex;gap:28px;align-items:flex-start}.single{display:flex}
.card{position:relative;width:172px;background:#fff;border-radius:18px;padding:16px 12px 14px;text-align:center;border:2px solid transparent;box-shadow:0 6px 20px #283c5a17;transition:transform .18s ease,box-shadow .18s ease;animation:pop .35s ease backwards}.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #283c5a26}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}.card.masc{border-color:#bcd8f8;background:linear-gradient(180deg,#f7fbff,#fff)}.card.fem{border-color:#f8cbdd;background:linear-gradient(180deg,#fff8fb,#fff)}.avatar{width:56px;height:56px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:29px;line-height:1;cursor:pointer;border-radius:50%;border:none;background:#eef3fa;box-shadow:inset 0 0 0 1px #3c5a8c14}.card.fem .avatar{background:#fdeef4}.avatar:hover{transform:scale(1.08)}.campo{padding:3px 6px;border-radius:7px;outline:none;word-break:break-word;min-height:1.2em}.campo:hover{background:#3f7dfb12}.campo:focus{background:#3f7dfb21;box-shadow:0 0 0 2px #3f7dfb40}.campo:empty:before{content:attr(data-ph);color:#bcc6d4;font-style:italic}.nombre{font-weight:700;font-size:14.5px;color:#1f2b3d;line-height:1.25}.fechas{font-size:11.5px;color:#7f8da3;margin-top:5px}.lugar{font-size:11px;color:#a3aebe;margin-top:2px}.add,.del{position:absolute;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0}.add{top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:#3f7dfb;color:#fff;font-size:15px;box-shadow:0 2px 6px #3f7dfb66}.del{top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#f1f4f9;color:#93a0b3;font-size:15px}.card:hover .add,.card:hover .del{opacity:1}.add:hover{transform:scale(1.15)}.del:hover{background:#ffe3e3;color:#d64545}
.card-menu,.picker{position:fixed;z-index:200;background:#fff;border-radius:14px;padding:6px;box-shadow:0 14px 38px #1e2d4638;border:1px solid #e4eaf3;animation:pop .16s ease}.card-menu{display:flex;flex-direction:column;min-width:190px}.card-menu button{font:inherit;font-size:13px;font-weight:600;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer;border:none;background:transparent;color:#2b3442}.card-menu button:hover:not(:disabled){background:#eef4ff;color:#1a4ed8}.card-menu button:disabled{opacity:.35;cursor:not-allowed}.picker{z-index:100;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px}.picker button{width:32px;height:32px;border:none;background:transparent;font-size:19px;cursor:pointer;border-radius:8px}.picker button:hover{background:#eef4ff;transform:scale(1.15)}
@media(max-width:900px){#canvas{padding:40px 24px 60px;gap:80px}.gen{gap:42px}.family-group{gap:18px;padding-left:8px;padding-right:8px}.couple{gap:18px}.gen-label{display:none}.card{width:150px}}
</style>
</head>
<body>
<header><h1 id="titulo" contenteditable="true" spellcheck="false">Mi Árbol Genealógico</h1><p class="hint">✏️ Clic en el texto para editarlo · Pulsa <b>＋</b> en una tarjeta para añadir familiares · Clic en el icono para cambiarlo</p><div class="toolbar"><button id="btnExport">⬇ Exportar</button><button id="btnImport">⬆ Importar</button><button id="btnReset" class="danger">↺ Reiniciar</button><input type="file" id="fileInput" accept="application/json" hidden></div></header>
<main id="canvas"><svg id="lines"></svg></main>
<script>
const STORAGE_KEY='arbol-familiar-v2',EMOJIS=['🙂','😀','👨','👩','🧑','👦','👧','👴','👵','👶','🧔','👨‍🦱','👩‍🦰','👨‍🦳','👩‍🦳','🧒','💙','💗','🌟'];
function plantilla(){return{titulo:'Mi Árbol Genealógico',personas:{abueloP:{nombre:'Abuelo paterno',genero:'m',emoji:'👴',fechas:'',lugar:'',padres:[],pareja:'abuelaP'},abuelaP:{nombre:'Abuela paterna',genero:'f',emoji:'👵',fechas:'',lugar:'',padres:[],pareja:'abueloP'},abueloM:{nombre:'Abuelo materno',genero:'m',emoji:'👴',fechas:'',lugar:'',padres:[],pareja:'abuelaM'},abuelaM:{nombre:'Abuela materna',genero:'f',emoji:'👵',fechas:'',lugar:'',padres:[],pareja:'abueloM'},padre:{nombre:'Papá',genero:'m',emoji:'👨',fechas:'',lugar:'',padres:['abueloP','abuelaP'],pareja:'madre'},madre:{nombre:'Mamá',genero:'f',emoji:'👩',fechas:'',lugar:'',padres:['abueloM','abuelaM'],pareja:'padre'},yo:{nombre:'Yo',genero:'m',emoji:'🙂',fechas:'',lugar:'',padres:['padre','madre'],pareja:null}}}}
function cargar(){try{let d=JSON.parse(localStorage.getItem(STORAGE_KEY));return d&&d.personas&&d.personas.yo&&Array.isArray(d.personas.yo.padres)?d:null}catch(e){return null}}function guardar(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}let data=cargar()||plantilla();
function computeLevels(){let nivel={yo:0},q=['yo'],seen=new Set;while(q.length){let id=q.shift();if(seen.has(id)||!data.personas[id])continue;seen.add(id);let l=nivel[id],p=data.personas[id];(p.padres||[]).forEach(x=>{if(data.personas[x]&&nivel[x]===undefined){nivel[x]=l+1;q.push(x)}});if(p.pareja&&data.personas[p.pareja]&&nivel[p.pareja]===undefined){nivel[p.pareja]=l;q.push(p.pareja)};for(let x in data.personas)if((data.personas[x].padres||[]).includes(id)&&nivel[x]===undefined){nivel[x]=l-1;q.push(x)}}let out={};for(let id in nivel)(out[nivel[id]]??=[]).push(id);return out}
function groupIntoUnits(ids){let out=[],used=new Set;for(let id of ids){if(used.has(id))continue;let p=data.personas[id],pair=p.pareja&&ids.includes(p.pareja)&&!used.has(p.pareja);out.push(pair?[id,p.pareja]:[id]);(pair?[id,p.pareja]:[id]).forEach(x=>used.add(x))}return out}
function familyKey(unit){let ids=unit.filter(id=>(data.personas[id].padres||[]).length);if(!ids.length){let partner=unit.map(id=>data.personas[id].pareja).find(x=>x&&data.personas[x]&&(data.personas[x].padres||[]).length);if(partner)ids=[partner]}if(ids.length)return 'parents:'+[...data.personas[ids[0]].padres].sort().join('|');return 'solo:'+unit.join('|')}
function ordenarNiveles(levels){let keys=Object.keys(levels).map(Number).sort((a,b)=>b-a),orden={};for(let l of keys){let units=groupIntoUnits(levels[l]),familias=[],map=new Map;for(let u of units){let k=familyKey(u);if(!map.has(k)){let g={key:k,units:[],ids:[]};map.set(k,g);familias.push(g)}let g=map.get(k);g.units.push(u);g.ids.push(...u)}orden[l]=familias}function pos(id){for(let l of keys)for(let i=0;i<orden[l].length;i++)if(orden[l][i].ids.includes(id))return i*10+orden[l][i].ids.indexOf(id);return -1}for(let n=0;n<4;n++)for(let l of keys)orden[l].forEach(g=>g.units.sort((a,b)=>(pos(a[0])<0?0:pos(a[0]))-(pos(b[0])<0?0:pos(b[0]))));return{keys,orden}}
function render(){let c=document.getElementById('canvas');c.querySelectorAll('.gen').forEach(x=>x.remove());let levels=computeLevels(),o=ordenarNiveles(levels),labels={0:'Yo',1:'Padres',2:'Abuelos',3:'Bisabuelos',4:'Tatarabuelos','-1':'Hijos','-2':'Nietos','-3':'Bisnietos'};for(let l of o.keys){let row=document.createElement('div');row.className='gen';let lab=document.createElement('span');lab.className='gen-label';lab.textContent=labels[l]||(l>0?'+'+l:l);row.append(lab);for(let g of o.orden[l]){let box=document.createElement('div');box.className='family-group '+(g.key.startsWith('parents:')?'has-children':'');for(let u of g.units){let w=document.createElement('div');w.className=u.length===2?'couple':'single';u.forEach(id=>w.append(crearTarjeta(id)));box.append(w)}row.append(box)}c.append(row)}programarDibujo()}
function crearTarjeta(id){let p=data.personas[id],card=document.createElement('div');card.className='card '+(p.genero==='f'?'fem':'masc');card.dataset.id=id;let add=document.createElement('button');add.className='add';add.type='button';add.textContent='＋';add.title='Añadir familiar';add.onclick=e=>{e.stopPropagation();abrirMenu(id,add)};card.append(add);let av=document.createElement('button');av.className='avatar';av.type='button';av.textContent=p.emoji||'🙂';av.title='Cambiar icono';av.onclick=()=>abrirPicker(av,id);card.append(av);card.append(campo(id,'nombre','Nombre','nombre'),campo(id,'fechas','1950 – 2020','fechas'),campo(id,'lugar','Ciudad','lugar'));if(id!=='yo'){let d=document.createElement('button');d.className='del';d.type='button';d.textContent='×';d.title='Eliminar';d.onclick=()=>removePerson(id);card.append(d)}return card}
function campo(id,key,ph,cl){let e=document.createElement('div');e.className='campo '+cl;e.contentEditable=true;e.spellcheck=false;e.dataset.ph=ph;e.textContent=data.personas[id][key]||'';e.oninput=()=>{data.personas[id][key]=e.textContent.trim();guardar();programarDibujo()};e.onblur=()=>{if(!e.textContent.trim())e.innerHTML='';data.personas[id][key]=e.textContent.trim();guardar();programarDibujo()};e.onkeydown=x=>{if(x.key==='Enter'){x.preventDefault();e.blur()}};e.onpaste=x=>{x.preventDefault();document.execCommand('insertText',false,(x.clipboardData||window.clipboardData).getData('text/plain'))};return e}
let rafId=null;function programarDibujo(){if(!rafId)rafId=requestAnimationFrame(()=>{rafId=null;dibujarLineas()})}
function dibujarLineas(){let c=document.getElementById('canvas'),s=document.getElementById('lines'),cr=c.getBoundingClientRect(),sl=c.scrollLeft,st=c.scrollTop,W=c.scrollWidth,H=c.scrollHeight;s.setAttribute('width',W);s.setAttribute('height',H);s.style.width=W+'px';s.style.height=H+'px';let rect=id=>{let e=document.querySelector('.card[data-id="'+id+'"]');if(!e)return null;let r=e.getBoundingClientRect();return{left:r.left-cr.left+sl,right:r.right-cr.left+sl,top:r.top-cr.top+st,bottom:r.bottom-cr.top+st,cx:r.left-cr.left+sl+r.width/2,cy:r.top-cr.top+st+r.height/2}},groups={};for(let id in data.personas){let p=data.personas[id];if(!(p.padres||[]).length)continue;let k=[...p.padres].sort().join('|');(groups[k]??={parents:p.padres.slice(),children:[]}).children.push(id)}let paths=[];for(let k in groups){let g=groups[k],ps=g.parents.map(rect).filter(Boolean),cs=g.children.map(rect).filter(Boolean);if(!ps.length||!cs.length)continue;let mid,y;if(ps.length===2){let A=ps[0],B=ps[1],L=A.cx<B.cx?A:B,R=A.cx<B.cx?B:A;y=Math.max(A.bottom,B.bottom)+10;paths.push(`M ${L.cx} ${L.bottom} V ${y} M ${R.cx} ${R.bottom} V ${y} M ${L.cx} ${y} H ${R.cx}`);mid=(L.cx+R.cx)/2}else{mid=ps[0].cx;y=ps[0].bottom}let union=Math.max(...ps.map(x=>x.bottom))+((Math.min(...cs.map(x=>x.top))-Math.max(...ps.map(x=>x.bottom)))*.45);paths.push(`M ${mid} ${y} V ${union}`);let xs=cs.map(x=>x.cx),min=Math.min(mid,...xs),max=Math.max(mid,...xs);if(max-min>1)paths.push(`M ${min} ${union} H ${max}`);cs.forEach(x=>paths.push(`M ${x.cx} ${union} V ${x.top}`))}s.innerHTML=paths.map(d=>`<path d="${d}"/>`).join('')}
let menuEl=null;function abrirMenu(id,a){cerrarMenu();let p=data.personas[id],m=document.createElement('div');m.className='card-menu';let hasM=p.padres.some(x=>data.personas[x]?.genero==='m'),hasF=p.padres.some(x=>data.personas[x]?.genero==='f'),free=p.padres.length<2;function add(t,f,dis=false){let b=document.createElement('button');b.textContent=t;b.disabled=dis;if(!dis)b.onclick=()=>{cerrarMenu();f()};m.append(b)}add('↑  Añadir padre',()=>addParent(id,'m'),!free||hasM);add('↑  Añadir madre',()=>addParent(id,'f'),!free||hasF);add('↓  Añadir hijo/a',()=>addChild(id));add('↔  Añadir hermano/a',()=>addSibling(id),!p.padres.length);add('💑  Añadir pareja',()=>addPartner(id),!!p.pareja);if(id!=='yo')add('✕  Eliminar',()=>removePerson(id));document.body.append(m);let r=a.getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight,left=Math.min(r.left,innerWidth-mw-8),top=r.bottom+6;if(top+mh>innerHeight-8)top=r.top-mh-6;m.style.left=Math.max(8,left)+'px';m.style.top=Math.max(8,top)+'px';menuEl=m;setTimeout(()=>document.addEventListener('click',fueraMenu),0)}function fueraMenu(e){if(menuEl&&!menuEl.contains(e.target))cerrarMenu()}function cerrarMenu(){if(menuEl){menuEl.remove();menuEl=null}document.removeEventListener('click',fueraMenu)}
function uid(p){return p+Date.now()+Math.floor(Math.random()*1000)}function addParent(id,g){let p=data.personas[id];if(p.padres.length>=2)return;let n=uid('p');data.personas[n]={nombre:g==='m'?'Padre':'Madre',genero:g,emoji:g==='m'?'👨':'👩',fechas:'',lugar:'',padres:[],pareja:null};p.padres.push(n);guardar();render()}function addChild(id){let p=data.personas[id],n=uid('c'),parents=[id];if(p.pareja&&data.personas[p.pareja])parents.push(p.pareja);data.personas[n]={nombre:'Hijo/a',genero:'m',emoji:'🧒',fechas:'',lugar:'',padres:parents,pareja:null};guardar();render()}function addSibling(id){let p=data.personas[id];if(!p.padres.length)return alert('Esta persona necesita al menos un progenitor. Añádele primero un padre o una madre.');let n=uid('s');data.personas[n]={nombre:'Hermano/a',genero:'m',emoji:'🧑',fechas:'',lugar:'',padres:[...p.padres],pareja:null};guardar();render()}function addPartner(id){let p=data.personas[id];if(p.pareja)return;let n=uid('p'),g=p.genero==='m'?'f':'m';data.personas[n]={nombre:'Pareja',genero:g,emoji:g==='m'?'👨':'👩',fechas:'',lugar:'',padres:[],pareja:id};p.pareja=n;guardar();render()}function removePerson(id){if(id==='yo'||!confirm('¿Eliminar a esta persona del árbol?'))return;delete data.personas[id];for(let x in data.personas){data.personas[x].padres=(data.personas[x].padres||[]).filter(y=>y!==id);if(data.personas[x].pareja===id)data.personas[x].pareja=null}guardar();render()}
let pickerEl=null;function abrirPicker(a,id){cerrarPicker();let p=document.createElement('div');p.className='picker';EMOJIS.forEach(x=>{let b=document.createElement('button');b.type='button';b.textContent=x;b.onclick=()=>{data.personas[id].emoji=x;a.textContent=x;guardar();cerrarPicker()};p.append(b)});document.body.append(p);let r=a.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;p.style.left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8))+'px';p.style.top=(r.bottom+h+12>innerHeight?r.top-h-8:r.bottom+8)+'px';pickerEl=p;setTimeout(()=>document.addEventListener('click',fueraClick),0)}function fueraClick(e){if(pickerEl&&!pickerEl.contains(e.target))cerrarPicker()}function cerrarPicker(){if(pickerEl){pickerEl.remove();pickerEl=null}document.removeEventListener('click',fueraClick)}
function exportar(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='arbol-genealogico.json';a.click();URL.revokeObjectURL(u)}function importar(f){let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.personas||!d.personas.yo)throw Error('Formato inválido');data=d;guardar();tituloEl.textContent=data.titulo||'Mi Árbol Genealógico';render()}catch(e){alert('No se pudo importar: '+e.message)}};r.readAsText(f)}function reiniciar(){if(!confirm('Se borrarán todos los cambios. ¿Continuar?'))return;data=plantilla();guardar();tituloEl.textContent=data.titulo;render()}
const tituloEl=document.getElementById('titulo');tituloEl.textContent=data.titulo||'Mi Árbol Genealógico';tituloEl.oninput=()=>{data.titulo=tituloEl.textContent.trim();guardar()};tituloEl.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tituloEl.blur()}};document.getElementById('btnExport').onclick=exportar;document.getElementById('btnReset').onclick=reiniciar;let fileInput=document.getElementById('fileInput');document.getElementById('btnImport').onclick=()=>fileInput.click();fileInput.onchange=e=>{if(e.target.files[0])importar(e.target.files[0]);e.target.value=''};render();addEventListener('resize',programarDibujo);if(document.fonts?.ready)document.fonts.ready.then(programarDibujo);new ResizeObserver(programarDibujo).observe(document.getElementById('canvas'));
</script>
</body>
</html>

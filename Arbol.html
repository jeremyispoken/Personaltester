<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌳 Mi Árbol Genealógico</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:'Segoe UI',system-ui,sans-serif;color:#2b3442;min-height:100vh;padding-bottom:50px;background:radial-gradient(1200px 600px at 12% -10%,#fff3e2 0%,transparent 60%),radial-gradient(1000px 520px at 92% 5%,#e6efff 0%,transparent 55%),#f4f7fb}header{padding:26px 20px 8px;text-align:center}h1{display:inline-block;margin:0;padding:4px 14px;border-radius:12px;font-size:clamp(19px,3vw,28px);color:#1e2a3c}.hint{font-size:12.5px;color:#8592a6;margin:8px 0 14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.toolbar button,.manual-actions button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;border:1px solid #d7e0ec;background:#fff;color:#3c4a5e;box-shadow:0 2px 6px #283c5a10}.toolbar button:hover,.manual-actions button:hover{transform:translateY(-2px);box-shadow:0 6px 14px #283c5a1f}.toolbar .active{background:#3f7dfb;color:#fff;border-color:#3f7dfb}.toolbar .danger{color:#c33;background:#fff1f1}#canvas{position:relative;display:flex;flex-direction:column;align-items:center;gap:75px;padding:55px 60px 80px;overflow-x:auto}.gen{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-start;gap:48px;z-index:1}.gen-label{position:absolute;left:0;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#a8b4c6}.family-group{display:flex;align-items:flex-start;gap:28px;padding:0 14px 12px;border-radius:18px;position:relative}.family-group.has-children{background:rgba(255,255,255,.28);box-shadow:0 0 0 1px rgba(195,207,224,.35)}.family-group.manual-target{outline:2px dashed #3f7dfb;outline-offset:7px}.couple,.single{display:flex;gap:28px;align-items:flex-start}.card{position:relative;width:172px;background:#fff;border-radius:18px;padding:16px 12px 14px;text-align:center;border:2px solid transparent;box-shadow:0 6px 20px #283c5a17;transition:.18s}.card.masc{border-color:#bcd8f8;background:linear-gradient(180deg,#f7fbff,#fff)}.card.fem{border-color:#f8cbd8;background:linear-gradient(180deg,#fff8fb,#fff)}.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #283c5a26}.avatar{width:56px;height:56px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:29px;border-radius:50%;border:0;background:#eef3fa;cursor:pointer}.campo{padding:3px 6px;border-radius:7px;outline:0;word-break:break-word;min-height:1.2em}.campo:focus{background:#3f7dfb21}.campo:empty:before{content:attr(data-ph);color:#bcc6d4;font-style:italic}.nombre{font-weight:700;font-size:14px}.fechas{font-size:11.5px;color:#7f8da3;margin-top:5px}.lugar{font-size:11px;color:#a3aebe;margin-top:2px}.add,.del{position:absolute;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}.add{top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:#3f7dfb;color:#fff;font-size:15px}.del{top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#f1f4f9;color:#93a0b3}.card:hover .add,.card:hover .del{opacity:1}.manual-actions{display:none;position:absolute;bottom:-4px;left:50%;transform:translate(-50%,100%);gap:4px;z-index:5;white-space:nowrap}.manual-mode .manual-actions{display:flex}.manual-actions button{padding:4px 8px;font-size:12px;background:#fff}.manual-note{display:none;margin:-2px auto 18px;max-width:700px;text-align:center;color:#3f6fc9;font-size:12px}.manual-mode .manual-note{display:block}.card-menu,.picker{position:fixed;z-index:200;background:#fff;border-radius:14px;padding:6px;box-shadow:0 14px 38px #1e2d4638;border:1px solid #e4eaf3}.card-menu{display:flex;flex-direction:column;min-width:195px}.card-menu button{font:inherit;font-size:13px;font-weight:600;text-align:left;padding:9px 12px;border:0;border-radius:9px;background:transparent;cursor:pointer}.card-menu button:hover{background:#eef4ff}.picker{z-index:201;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.picker button{width:32px;height:32px;border:0;background:transparent;font-size:19px;cursor:pointer;border-radius:8px}.picker button:hover{background:#eef4ff}@media(max-width:900px){#canvas{padding:40px 24px 60px;gap:65px}.gen{gap:34px}.family-group{gap:18px;padding:0 8px 12px}.couple,.single{gap:18px}.gen-label{display:none}.card{width:150px}.manual-actions{position:static;transform:none;justify-content:center;margin-top:6px}}
</style>
</head>
<body>
<header><h1 id="titulo" contenteditable="true" spellcheck="false">Mi Árbol Genealógico</h1><p class="hint">✏️ Edita los datos directamente · Pulsa <b>＋</b> en una tarjeta para añadir familiares</p><p class="manual-note">↕ <b>Orden manual activado:</b> usa las flechas de cada procedencia para reagrupar las familias y facilitar la lectura de las descendencias.</p><div class="toolbar"><button id="btnManual">↕ Orden manual</button><button id="btnExport">⇩ Exportar</button><button id="btnImport">⇧ Importar</button><button id="btnReset" class="danger">↻ Reiniciar</button><input type="file" id="fileInput" accept="application/json" hidden></div></header>
<main id="canvas"></main>
<script>
const STORAGE_KEY='arbol-familiar-v2',EMOJIS=['🙂','😀','👨','👩','🧑','👦','👧','👴','👵','👶','🧔','👨‍🦱','👩‍🦰','👨‍🦳','👩‍🦳','🧒','💙','💗'];
function plantilla(){return{titulo:'Mi Árbol Genealógico',personas:{abueloP:{nombre:'Abuelo paterno',genero:'m',emoji:'👴',fechas:'',lugar:'',padres:[],pareja:'abuelaP'},abuelaP:{nombre:'Abuela paterna',genero:'f',emoji:'👵',fechas:'',lugar:'',padres:[],pareja:'abueloP'},abueloM:{nombre:'Abuelo materno',genero:'m',emoji:'👴',fechas:'',lugar:'',padres:[],pareja:'abuelaM'},abuelaM:{nombre:'Abuela materna',genero:'f',emoji:'👵',fechas:'',lugar:'',padres:[],pareja:'abueloM'},padre:{nombre:'Papá',genero:'m',emoji:'👨',fechas:'',lugar:'',padres:['abueloP','abuelaP'],pareja:'madre'},madre:{nombre:'Mamá',genero:'f',emoji:'👩',fechas:'',lugar:'',padres:['abueloM','abuelaM'],pareja:'padre'},yo:{nombre:'Yo',genero:'m',emoji:'🙂',fechas:'',lugar:'',padres:['padre','madre'],pareja:null}},ordenManual:{}}}
function cargar(){try{let d=JSON.parse(localStorage.getItem(STORAGE_KEY));return d&&d.personas&&d.personas.yo?d:null}catch(e){return null}}function guardar(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}}
let data=cargar()||plantilla(),manual=false;
function computeLevels(){let level={yo:0},q=['yo'],seen=new Set;while(q.length){let id=q.shift();if(seen.has(id)||!data.personas[id])continue;seen.add(id);let l=level[id],p=data.personas[id];(p.padres||[]).forEach(x=>{if(data.personas[x]&&level[x]===undefined){level[x]=l+1;q.push(x)}});if(p.pareja&&data.personas[p.pareja]&&level[p.pareja]===undefined){level[p.pareja]=l;q.push(p.pareja)}};let out={};Object.keys(level).forEach(id=>(out[level[id]]??=[]).push(id));return out}
function units(ids){let out=[],used=new Set;ids.forEach(id=>{if(used.has(id))return;let p=data.personas[id],pair=p.pareja&&ids.includes(p.pareja)&&!used.has(p.pareja),u=pair?[id,p.pareja]:[id];u.forEach(x=>used.add(x));out.push(u)});return out}
function key(u){let withParents=u.filter(id=>(data.personas[id].padres||[]).length);if(withParents.length)return'parents:'+withParents[0]+':'+(data.personas[withParents[0]].padres||[]).slice().sort().join('|');return'solo:'+u.join('|')}
function ordered(level,ids){let groups=units(ids).map(u=>({ids:u,key:key(u)})),saved=data.ordenManual?.[level]||[];groups.sort((a,b)=>{let x=saved.indexOf(a.key),y=saved.indexOf(b.key);if(x<0)x=9999;if(y<0)y=9999;return x-y});return groups}
function render(){let c=document.getElementById('canvas');c.innerHTML='';let levels=computeLevels(),labels={0:'Yo',1:'Padres',2:'Abuelos',3:'Bisabuelos',4:'Tatarabuelos','-1':'Hijos','-2':'Nietos'};Object.keys(levels).map(Number).sort((a,b)=>b-a).forEach(l=>{let row=document.createElement('div');row.className='gen';let lab=document.createElement('span');lab.className='gen-label';lab.textContent=labels[l]||(l>0?'Generación '+l:'Descendencia');row.append(lab);ordered(l,levels[l]).forEach((g,i)=>{let box=document.createElement('div');box.className='family-group '+(g.key.startsWith('parents:')?'has-children ':'')+(manual?'manual-target':'');let wrap=document.createElement('div');wrap.className=g.ids.length===2?'couple':'single';g.ids.forEach(id=>wrap.append(crearTarjeta(id)));box.append(wrap);if(manual){let actions=document.createElement('div');actions.className='manual-actions';[['◀',-1],['▶',1]].forEach(([txt,delta])=>{let b=document.createElement('button');b.type='button';b.textContent=txt;b.title=delta<0?'Mover procedencia a la izquierda':'Mover procedencia a la derecha';b.onclick=()=>mover(l,g.key,delta);actions.append(b)});box.append(actions)}row.append(box)});c.append(row)});programarDibujo()}
function mover(level,k,delta){let arr=ordered(level,computeLevels()[level]).map(g=>g.key),i=arr.indexOf(k),j=i+delta;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];data.ordenManual[level]=arr;guardar();render()}
function crearTarjeta(id){let p=data.personas[id],card=document.createElement('div');card.className='card '+(p.genero==='f'?'fem':'masc');card.dataset.id=id;let add=document.createElement('button');add.className='add';add.type='button';add.textContent='＋';add.title='Añadir familiar';add.onclick=e=>{e.stopPropagation();abrirMenu(id,add)};card.append(add);let av=document.createElement('button');av.className='avatar';av.type='button';av.textContent=p.emoji||'🙂';av.onclick=()=>abrirPicker(av,id);card.append(av);card.append(campo(id,'nombre','Nombre','nombre'),campo(id,'fechas','1950 – 2020','fechas'),campo(id,'lugar','Ciudad','lugar'));if(id!=='yo'){let d=document.createElement('button');d.className='del';d.type='button';d.textContent='×';d.title='Eliminar';d.onclick=()=>removePerson(id);card.append(d)}return card}
function campo(id,k,ph,cl){let e=document.createElement('div');e.className='campo '+cl;e.contentEditable=true;e.spellcheck=false;e.dataset.ph=ph;e.textContent=data.personas[id][k]||'';e.oninput=()=>{data.personas[id][k]=e.textContent.trim();guardar()};e.onkeydown=x=>{if(x.key==='Enter'){x.preventDefault();e.blur()}};return e}
function uid(p){return p+Date.now()+Math.floor(Math.random()*1000)}
function addParent(id,g){let p=data.personas[id];if((p.padres||[]).length>=2)return;let n=uid('p');data.personas[n]={nombre:g==='m'?'Padre':'Madre',genero:g,emoji:g==='m'?'👨':'👩',fechas:'',lugar:'',padres:[],pareja:null};p.padres=p.padres||[];p.padres.push(n);guardar();render()}
function addChild(id){let p=data.personas[id],n=uid('c'),parents=[id];if(p.pareja&&data.personas[p.pareja])parents.push(p.pareja);data.personas[n]={nombre:'Hijo/a',genero:'m',emoji:'👶',fechas:'',lugar:'',padres:parents,pareja:null};guardar();render()}
function addPartner(id){let p=data.personas[id];if(p.pareja)return;let n=uid('p'),g=p.genero==='m'?'f':'m';data.personas[n]={nombre:'Pareja',genero:g,emoji:g==='m'?'👨':'👩',fechas:'',lugar:'',padres:[],pareja:id};p.pareja=n;guardar();render()}
let menuEl=null;function abrirMenu(id,a){cerrarMenu();let p=data.personas[id],m=document.createElement('div');m.className='card-menu';[['👤 Añadir padre',()=>addParent(id,'m')],['👩 Añadir madre',()=>addParent(id,'f')],['👶 Añadir hijo/a',()=>addChild(id)],['💞 Añadir pareja',()=>addPartner(id)]].forEach(([t,f])=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{cerrarMenu();f()};m.append(b)});document.body.append(m);let r=a.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-205)+'px';m.style.top=Math.min(r.bottom+6,innerHeight-m.offsetHeight-8)+'px';menuEl=m;setTimeout(()=>document.addEventListener('click',cerrarMenu,{once:true}),0)}function cerrarMenu(){if(menuEl){menuEl.remove();menuEl=null}}
let pickerEl=null;function abrirPicker(a,id){cerrarPicker();let p=document.createElement('div');p.className='picker';EMOJIS.forEach(x=>{let b=document.createElement('button');b.type='button';b.textContent=x;b.onclick=()=>{data.personas[id].emoji=x;guardar();cerrarPicker();render()};p.append(b)});document.body.append(p);let r=a.getBoundingClientRect();p.style.left=Math.max(8,Math.min(r.left,innerWidth-p.offsetWidth-8))+'px';p.style.top=Math.min(r.bottom+6,innerHeight-p.offsetHeight-8)+'px';pickerEl=p;setTimeout(()=>document.addEventListener('click',cerrarPicker,{once:true}),0)}function cerrarPicker(){if(pickerEl){pickerEl.remove();pickerEl=null}}
function removePerson(id){if(!confirm('¿Eliminar esta persona?'))return;delete data.personas[id];Object.values(data.personas).forEach(p=>{p.padres=(p.padres||[]).filter(x=>x!==id);if(p.pareja===id)p.pareja=null});Object.keys(data.ordenManual||{}).forEach(l=>data.ordenManual[l]=data.ordenManual[l].filter(k=>!k.includes(id)));guardar();render()}
function exportar(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='arbol-genealogico.json';a.click();URL.revokeObjectURL(u)}
function importar(f){let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.personas?.yo)throw Error('Formato inválido');data=d;data.ordenManual=data.ordenManual||{};guardar();titulo.textContent=data.titulo||'Mi Árbol Genealógico';render()}catch(e){alert('No se pudo importar: '+e.message)}};r.readAsText(f)}
let rafId=null;function programarDibujo(){if(!rafId)rafId=requestAnimationFrame(()=>{rafId=null})}
const titulo=document.getElementById('titulo');titulo.textContent=data.titulo||'Mi Árbol Genealógico';titulo.oninput=()=>{data.titulo=titulo.textContent.trim();guardar()};document.getElementById('btnManual').onclick=()=>{manual=!manual;document.body.classList.toggle('manual-mode',manual);document.getElementById('btnManual').classList.toggle('active',manual);render()};document.getElementById('btnExport').onclick=exportar;document.getElementById('btnImport').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>e.target.files[0]&&importar(e.target.files[0]);document.getElementById('btnReset').onclick=()=>{if(confirm('¿Borrar todos los cambios?')){data=plantilla();guardar();titulo.textContent=data.titulo;render()}};render();
</script>
</body>
</html>
